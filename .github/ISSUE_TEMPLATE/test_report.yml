name: Test report
description: You played a session. Tell us how it went, good or bad.
title: "[Test] "
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Test reports are just as useful as bug reports: knowing what *works* tells us what's safe to build on.
        For a specific bug, a separate [bug report](https://github.com/Dashrendar2507/oblivionmp-coop/issues/new?template=bug_report.yml)
        is easier to track.

  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "0.7.0"
    validations:
      required: true

  - type: input
    id: oblivionmp
    attributes:
      label: OblivionMP server version
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: session
    attributes:
      label: Session
      description: How many players, roughly how long, and were you the host?
      placeholder: "3 players, about 2 hours, I hosted"
    validations:
      required: true

  - type: checkboxes
    id: worked
    attributes:
      label: What did you try, and did it work?
      description: Tick what worked. Leave unticked what you didn't try or what didn't work, and say which in the box below.
      options:
        - label: Quest progress reached the other players live
        - label: Catching up on join, without pop-ups
        - label: My own quests came back after rejoining
        - label: Stage effects (teleports, rewards...) matched the web page switches
        - label: Conversation overlay and freeze
        - label: Revive (Alt+H) and respawn (Alt+G)
        - label: Back where you left (outside and inside buildings)
        - label: Web admin page (source player, give a stage, reset a quest)
        - label: Travel to a teammate (/coop goto, Alt+O) or to a conversation (Alt+Y)
        - label: "New character: prison start (play the intro or skip to the sewer exit), or sewer exit once the intro was played"
        - label: Calming a fight (/coop calm or the web page)
        - label: Tags over heads (talking, bartering, lockpicking, pickpocketing, down)
        - label: Watchers heard the NPC's voice
        - label: "Nothing happened twice on OblivionMP 1.1 (quest pop-ups, journal entries, items, gold)"
        - label: "Sleeping, waiting and fast travel: the clock stayed and level-up worked (say who slept, below)"

  - type: textarea
    id: notes
    attributes:
      label: How did it go?
      description: What felt good, what felt wrong or awkward, which quests you played, anything that surprised you. If you tried something from the "Please test these" list in CONTRIBUTING.md, say what happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: The server log and UE4SS.log from the session, if something went wrong. Drag the files in.
