<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Down</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  body { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; }
  /* Below the middle of the screen, under OblivionMP's own "You died" message */
  .note { position: absolute; top: 62vh; left: 50%; transform: translateX(-50%); max-width: 46vw; padding: 1.1vh 1.4vw;
          background: rgba(10, 8, 6, .8); border: 1px solid rgba(216, 192, 138, .45); border-radius: 2px;
          color: #efe6d2; font-size: 1.9vh; line-height: 1.45; text-align: center; text-shadow: 0 1px 2px #000; }
  .note b { display: block; color: #d8c08a; font-weight: normal; letter-spacing: .08em; text-transform: uppercase;
            font-size: 1.4vh; margin-bottom: .4vh; }
</style>
</head>
<body>
<div class="note"><b>Co-op</b><span id="text"></span></div>
<script>
  // #<seconds>|<text>: {s} in the text counts down.
  var hash = decodeURIComponent(location.hash.slice(1));
  var bar = hash.indexOf("|");
  var left = parseInt(hash.slice(0, bar), 10) || 0;
  var text = hash.slice(bar + 1);
  var el = document.getElementById("text");
  function draw() { el.textContent = text.replace("{s}", String(Math.max(0, left))); }
  draw();
  setInterval(function () { left--; draw(); }, 1000);
</script>
</body>
</html>
