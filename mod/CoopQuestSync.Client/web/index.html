<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation</title>
<style>
  :root { --gold: #d8c08a; --gold-dim: #a8925f; --ink: #efe6d2; --shade: rgba(10, 8, 6, .78); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; color: var(--ink); }
  #root { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #root.on { opacity: 1; }
  /* Offered, not watching: only the banner, with the key to listen in */
  #root.offer .vignette, #root.offer .panel { display: none; }
  /* Darkened edges, like the game when it frames a conversation */
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.45) 100%); }
  /* Below the game's compass, which sits at the top centre */
  .who { position: absolute; top: 10.5vh; left: 50%; transform: translateX(-50%); padding: 6px 22px;
         background: var(--shade); border: 1px solid rgba(216,192,138,.35); border-radius: 2px;
         font-size: 1.6vh; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-dim); white-space: nowrap; }
  .who b { color: var(--gold); font-weight: normal; }
  .who .hint { margin-left: 1.4em; padding-left: 1.4em; border-left: 1px solid rgba(216,192,138,.3); color: var(--gold-dim); opacity: .8; text-transform: none; letter-spacing: .03em; }
  .panel { position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(62vw, 1100px);
           background: linear-gradient(to bottom, rgba(10,8,6,.55), var(--shade)); border-top: 1px solid rgba(216,192,138,.45);
           border-bottom: 1px solid rgba(216,192,138,.45); padding: 2.2vh 3vw 2.6vh; text-align: center; }
  .npc { font-size: 2.7vh; color: var(--gold); letter-spacing: .06em; margin-bottom: .6vh; text-shadow: 0 1px 2px #000; }
  .topic { font-size: 1.6vh; color: var(--gold-dim); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 1.2vh; min-height: 1.6vh; }
  .line { font-size: 2.3vh; line-height: 1.45; min-height: 3.4vh; text-shadow: 0 1px 2px #000; transition: opacity .25s ease; }
  .line.fade { opacity: 0; }
  .line.quiet { color: var(--gold-dim); font-style: italic; }
  .quest { margin-top: 1.2vh; font-size: 1.4vh; color: var(--gold-dim); letter-spacing: .05em; }
  .doing { margin: 0 auto 1.2vh; font-size: 1.7vh; color: var(--gold); letter-spacing: .08em; font-style: italic;
           max-height: 0; opacity: 0; overflow: hidden; transition: opacity .3s ease, max-height .3s ease; }
  .doing.on { max-height: 4vh; opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  .panel.waiting .line, .panel.waiting .topic { opacity: .45; }
  .rule { width: 40%; height: 1px; margin: 0 auto 1.2vh; background: linear-gradient(to right, transparent, rgba(216,192,138,.6), transparent); }
</style>
</head>
<body>
<div id="root">
  <div class="vignette"></div>
  <div class="who" id="who"></div>
  <div class="panel" id="panel">
    <div class="npc" id="npc"></div>
    <div class="topic" id="topic"></div>
    <div class="rule"></div>
    <div class="doing" id="doing"></div>
    <div class="line quiet" id="line">…</div>
    <div class="quest" id="quest"></div>
  </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let queue = [], timer = null, talker = "", npc = "";

function start(info) {
  talker = info.talker || "Someone";
  npc = info.npc || "";
  $("who").innerHTML = "";
  $("root").classList.toggle("offer", !!info.offer);
  if (!info.offer) $("who").append(document.createTextNode(info.frozen ? "Listening in · " : "Watching · "));
  const b = document.createElement("b"); b.textContent = talker; $("who").append(b);
  $("who").append(document.createTextNode(npc ? " talks with " + npc : " is in a conversation"));
  const hint = document.createElement("span"); hint.className = "hint"; const key = info.key || "Alt+U"; hint.textContent = info.offer ? key + " to listen in" : key + " to leave"; $("who").append(hint);
  // The join key (when the server allows travel): go to the talker, whether listening in or not.
  if (info.join) { const go = document.createElement("span"); go.className = "hint"; go.textContent = info.join + " to join " + talker; $("who").append(go); }
  $("npc").textContent = npc;
  $("topic").textContent = "";
  $("quest").textContent = "";
  setLine("…", true);
  activity({ activity: null });
  queue = []; clearTimeout(timer); timer = null;
  stopVoice();
  $("root").classList.add("on");
}

function setLine(text, quiet) {
  const el = $("line");
  el.classList.add("fade");
  setTimeout(() => { el.textContent = text; el.classList.toggle("quiet", !!quiet); el.classList.remove("fade"); }, 200);
}

// A topic can have several lines, spoken one after the other: show each long enough to read.
// With a voice, the line starts its voice as it shows (only while listening in, not on the offer banner), and
// stays a little longer: a spoken line takes about 75 ms a character.
let speaking = false;
function next() {
  timer = null;
  const item = queue.shift();
  if (!item) { stopVoice(); return; }
  setLine(item.text, item.quiet);
  const listening = !$("root").classList.contains("offer");
  if (item.voice && listening) { readym.sendSpeak(item.voice); speaking = true; }
  else stopVoice();
  const ms = item.voice ? Math.max(2500, item.text.length * 75 + 600) : Math.max(2500, item.text.length * 65);
  timer = setTimeout(next, ms);
}

function stopVoice() {
  if (!speaking) return;
  speaking = false;
  readym.sendSpeak("stop");
}

function line(info) {
  if (info.speaker) { npc = info.speaker; $("npc").textContent = npc; }
  $("topic").textContent = info.topic || "";
  $("quest").textContent = info.quest ? "Quest: " + info.quest : "";
  const voices = info.voices || [];
  const lines = (info.lines || []).map((t, i) => ({ text: t, voice: voices[i] || null })).filter(l => l.text);
  if (lines.length) lines.forEach(l => queue.push(l));
  else queue.push({ text: "(" + (info.topic || "…") + ")", quiet: true });
  if (!timer) next();
}

// The talker opened a menu from the conversation (barter, persuasion...): say so until they are back.
function activity(info) {
  const doing = info.activity;
  $("doing").textContent = doing ? (talker || "Someone") + " is " + doing + "…" : "";
  $("doing").classList.toggle("on", !!doing);
  $("panel").classList.toggle("waiting", !!doing);
}

function end() {
  queue = []; clearTimeout(timer); timer = null;
  stopVoice();
  $("root").classList.remove("on");
}

readym.on("Start", json => start(JSON.parse(json)));
readym.on("Line", json => line(JSON.parse(json)));
readym.on("Activity", json => activity(JSON.parse(json)));
readym.on("End", () => end());
readym.sendReady();
</script>
</body>
</html>
