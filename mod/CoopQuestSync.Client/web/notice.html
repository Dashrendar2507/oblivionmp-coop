<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restart</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  body { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; }
  /* Top left, out of the way of the compass (top centre) and the quest pop-ups */
  .note { position: absolute; top: 2.2vh; left: 1.6vw; max-width: 26vw; padding: .9vh 1.1vw;
          background: rgba(10, 8, 6, .78); border: 1px solid rgba(216, 192, 138, .45); border-radius: 2px;
          color: #efe6d2; font-size: 1.5vh; line-height: 1.4; text-shadow: 0 1px 2px #000; }
  .note b { display: block; color: #d8c08a; font-weight: normal; letter-spacing: .08em; text-transform: uppercase;
            font-size: 1.3vh; margin-bottom: .3vh; }
</style>
</head>
<body>
<div class="note"><b>Co-op</b>The co-op add-on was updated. Restart the game to turn the new one on.</div>
</body>
</html>
