<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-op Quest Sync</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6760; --line: #e2dfd8;
    --accent: #7a4b16; --accent-ink: #ffffff; --good: #2f7a3e; --warn: #9a5b00; --bad: #a33a2b; --chip: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --panel: #1f1e1c; --ink: #ecebe7; --muted: #a39f97; --line: #34322e;
            --accent: #d9a35f; --accent-ink: #1b1309; --good: #6cc47d; --warn: #e2a64a; --bad: #e57c6c; --chip: #2a2825; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  h1 { font-size: 18px; margin: 0 auto 0 0; }
  main { padding: 16px 20px 40px; max-width: 1200px; margin: 0 auto; }
  label { color: var(--muted); }
  select, input[type=search] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type=search] { width: min(320px, 100%); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .switch { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--ink); }
  .players { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .player { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .player b { display: block; }
  .phase { font-size: 12px; color: var(--muted); }
  .phase.Ready { color: var(--good); } .phase.Restoring, .phase.Handshake { color: var(--warn); } .phase.NoPlugin { color: var(--bad); }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .count { color: var(--muted); margin-left: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr.quest { cursor: pointer; }
  tr.quest:hover td { background: var(--chip); }
  .edid { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .detail td { background: var(--bg); padding: 10px 14px 14px; }
  .stage { display: grid; grid-template-columns: 52px 1fr auto auto; gap: 4px 12px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .stage:last-child { border-bottom: 0; }
  .num { font-variant-numeric: tabular-nums; color: var(--muted); }
  .marks { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .mark { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .mark.on { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .note { font-size: 12px; color: var(--warn); }
  .qactions { display: flex; gap: 8px; margin-top: 10px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  #err { color: var(--bad); }
  details.settings { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
  details.settings > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 24px; padding: 0 14px 14px; }
  .sgroup h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 14px 0 6px; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .srow:last-child { border-bottom: 0; }
  .srow span small { display: block; color: var(--muted); font-size: 12px; }
  .srow input.key { width: 44px; text-align: center; text-transform: uppercase; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin: 0 10px 0 4px; }
  .srow input[type=number] { width: 80px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  table.fx { border: 0; }
  table.fx th, table.fx td { padding: 4px 6px; text-align: center; }
  table.fx td:first-child, table.fx th:first-child { text-align: left; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .mark.fx { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .tag { font-size: 12px; margin-left: 6px; color: var(--warn); }
  .tag.ok { color: var(--good); }
  button.mini { font-size: 12px; padding: 1px 8px; margin-left: 6px; }
  .admin { white-space: nowrap; }
  @media (max-width: 640px) { .stage { grid-template-columns: 40px 1fr; } .marks, .stage > button { grid-column: 2; justify-content: flex-start; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Co-op Quest Sync</h1>
  <label class="switch"><input type="checkbox" id="auto"> Auto sync</label>
  <button id="calmAll" title="Every NPC fighting where a player is stops, and guards stop chasing players (needs the CoopQuestSyncUI add-on)">Calm all fights</button>
  <button class="danger" id="resetAll">Reset all shared progress</button>
  <span id="err"></span>
</header>
<main>
  <div class="players" id="players"></div>
  <details class="settings" id="settingsBox">
    <summary>Co-op settings</summary>
    <div class="sgrid" id="settings"></div>
  </details>
  <div class="tools">
    <input type="search" id="q" placeholder="Search quests or journal text">
    <select id="filter">
      <option value="any">Started by anyone</option>
      <option value="shared">In shared progress</option>
      <option value="all">All quests</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
"use strict";
let map = null, state = null, open = new Set(), password = "";
try { password = sessionStorage.getItem("cqs-pw") || ""; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const opts = { headers: { "X-Admin-Password": password } };
  if (body) { opts.method = "POST"; opts.body = JSON.stringify(body); opts.headers["X-Requested-With"] = "fetch"; opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opts);
  if (r.status === 401) {
    const pw = prompt("Admin password for the quest sync page:");
    if (pw === null) throw new Error("password needed");
    password = pw;
    try { sessionStorage.setItem("cqs-pw", pw); } catch (e) {}
    return api(path, body);
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

async function act(body) {
  try { await api("/api/action", body); $("err").textContent = ""; setTimeout(refresh, 400); }
  catch (e) { $("err").textContent = "Could not do that: " + e.message; }
}

async function refresh() {
  try {
    if (!map) map = await api("/api/map");
    state = await api("/api/state");
    $("err").textContent = "";
    render();
  } catch (e) { $("err").textContent = "Server not reachable: " + e.message; }
}

const ACCESS_TEXT = { panel: "admin (ReadyM panel)", page: "admin (this page)", unknownaccount: "account not known yet", ghost: "testing as Ghost (not admin)" };
function accessTag(p) {
  const a = p.access;
  if (!a || a.why === "everyone") return "";
  if (a.admin) return `<span class="tag ok">${esc(ACCESS_TEXT[a.why] || "admin")}</span>`;
  if (a.why === "unknownaccount" || a.why === "ghost") return `<span class="tag">${esc(ACCESS_TEXT[a.why])}</span>`;
  return ` <button class="mini" data-admin-add="${esc(p.name)}" title="Let ${esc(p.name)} use the admin commands (/qs push, reset...)">Make admin</button>`;
}
$("players").addEventListener("click", e => {
  const b = e.target.closest("[data-admin-add]");
  if (b) act({ action: "admin-add", player: b.dataset.adminAdd });
});

function stagesOf(set, quest) { return new Set((set && set[quest]) || []); }

function render() {
  $("auto").checked = state.auto;
  renderSettings();
  $("players").innerHTML = state.players.length
    ? state.players.map(p => `<div class="player"><b>${esc(p.name)}${p.name === state.settings.leader ? " ★" : ""}</b><span class="phase ${esc(p.phase)}">${esc(phaseText(p.phase))}</span>
        · ${Object.values(p.stages).reduce((a, s) => a + s.length, 0)} stages${p.talking && !(p.extra && p.extra.activity) ? `<span class="tag">talking</span>` : ""}${p.frozen ? `<span class="tag">watching (frozen)</span>` : ""}${p.extra && p.extra.downed ? `<span class="tag">down, ${p.extra.secondsLeft} s</span>` : ""}${p.extra && p.extra.activity ? `<span class="tag">${esc(p.extra.activity)}</span>` : ""}${p.combat ? `<span class="tag">in combat</span>` : ""}${accessTag(p)}
        <div><button data-calm="${esc(p.name)}" title="Stop the fights in ${esc(p.name)}'s area and clear their bounty (needs the CoopQuestSyncUI add-on)">Calm</button></div></div>`).join("")
    : `<div class="player"><span class="phase">Nobody is connected.</span></div>`;

  $("head").innerHTML = `<th>Quest</th><th>Shared</th>` + state.players.map(p => `<th class="hide-sm">${esc(p.name)}</th>`).join("");

  const term = $("q").value.trim().toLowerCase();
  const filter = $("filter").value;
  const quests = map.quests.filter(q => {
    const anyone = state.shared[q.editorId] || state.players.some(p => p.stages[q.editorId]);
    if (filter === "shared" && !state.shared[q.editorId]) return false;
    if (filter === "any" && !anyone) return false;
    if (!term) return true;
    return (q.name || "").toLowerCase().includes(term) || q.editorId.toLowerCase().includes(term)
      || q.stages.some(s => (s.text || "").toLowerCase().includes(term));
  }).sort((a, b) => (a.name || a.editorId).localeCompare(b.name || b.editorId));

  $("count").textContent = `${quests.length} of ${map.quests.length} quests`;
  if (!quests.length) {
    $("rows").innerHTML = `<tr><td colspan="${2 + state.players.length}" class="empty">${filter === "all" ? "No quests match." : "No quest progress yet. Choose \"All quests\" to see everything."}</td></tr>`;
    return;
  }
  $("rows").innerHTML = quests.map(q => row(q)).join("");
}

function phaseText(p) {
  return { Ready: "in sync", CatchingUp: "catching up", Restoring: "restoring progress", Handshake: "joining", NoPlugin: "plugin not found" }[p] || p;
}

function row(q) {
  const shared = stagesOf(state.shared, q.editorId);
  const total = q.stages.length;
  const pct = Math.round(100 * shared.size / total);
  let html = `<tr class="quest" data-q="${esc(q.editorId)}">
    <td><b>${esc(q.name || q.editorId)}</b> <span class="edid">${esc(q.editorId)}${q.sync ? "" : " · local only"}</span></td>
    <td>${q.sync ? `<span class="bar"><i style="width:${pct}%"></i></span>${shared.size}/${total}` : "–"}</td>`
    + state.players.map(p => `<td class="hide-sm">${(p.stages[q.editorId] || []).length || ""}</td>`).join("") + `</tr>`;
  if (open.has(q.editorId)) {
    html += `<tr class="detail"><td colspan="${2 + state.players.length}">` + q.stages.map(s => {
      const marks = (q.sync ? [`<span class="mark ${shared.has(s.stage) ? "on" : ""}">shared</span>`] : [])
        .concat(state.players.map(p => `<span class="mark ${stagesOf(p.stages, q.editorId).has(s.stage) ? "on" : ""}">${esc(p.name)}</span>`));
      const btn = q.sync && !shared.has(s.stage)
        ? `<button class="primary" data-push="${esc(q.editorId)}" data-stage="${s.stage}" title="Add to shared progress and give it to every player in game">Give to everyone</button>` : `<span></span>`;
      const fx = (s.effects || []).map(c => `<span class="mark fx" title="This stage's script has a ${esc(FX[c] || c)} effect">${esc(FX[c] || c)}</span>`).join(" ");
      return `<div class="stage"><span class="num">${s.stage}</span>
        <span>${esc(s.text || (state.hasText ? "(no journal entry)" : "(journal text needs strings.json)"))}${fx ? `<br>${fx}` : ""}</span>
        <span class="marks">${marks.join("")}</span>${btn}</div>`;
    }).join("") + (q.sync ? `<div class="qactions"><button class="danger" data-reset="${esc(q.editorId)}">Reset this quest</button></div>` : "")
      + `</td></tr>`;
  }
  return html;
}

$("rows").addEventListener("click", e => {
  const push = e.target.closest("[data-push]");
  if (push) { act({ action: "push", quest: push.dataset.push, stage: Number(push.dataset.stage) }); return; }
  const reset = e.target.closest("[data-reset]");
  if (reset) {
    if (confirm("Reset this quest?\n\nIt leaves the shared progress, and its hidden tokens are taken from everyone in game. "
      + "The game can't undo a quest while someone is playing, so each player keeps it until they rejoin."))
      act({ action: "reset-quest", quest: reset.dataset.reset });
    return;
  }
  const tr = e.target.closest("tr.quest");
  if (tr) { const q = tr.dataset.q; open.has(q) ? open.delete(q) : open.add(q); render(); }
});
$("auto").addEventListener("change", e => act({ action: "auto", on: e.target.checked }));
$("players").addEventListener("click", e => {
  const calm = e.target.closest("[data-calm]");
  if (calm && confirm(`Stop the fights around ${calm.dataset.calm} and clear their bounty?`)) act({ action: "calm", player: calm.dataset.calm });
});
$("calmAll").addEventListener("click", () => {
  if (confirm("Stop every fight where a player is, and the guards' chase?")) act({ action: "calm" });
});
$("resetAll").addEventListener("click", () => {
  if (confirm("Reset every shared quest?\n\nThe shared progress is cleared and the hidden tokens are taken from everyone, including players who join later. "
    + "The game can't undo quests while someone is playing, so each player keeps their quests until they rejoin."))
    act({ action: "reset-all" });
});
const FX = { teleport: "Teleport", combat: "Combat", items: "Items", status: "Status", ranks: "Faction ranks", cutscene: "Cut scene" };
const FX_HINT = {
  teleport: "moves the player (MoveTo, SetPos)", combat: "starts or stops fights", items: "gives or takes items: rewards",
  status: "spells, stats, fame, bounty", ranks: "joins factions, sets ranks", cutscene: "turns controls off, menus, videos"
};
const choices = {
  progressFrom: [["anyone", "Anyone"], ["leader", "Leader only"]],
  conversationOverlay: [["everyone", "Everyone"], ["area", "Same area only"], ["off", "Off"]],
  conversationFreeze: [["area", "Same area"], ["everyone", "Everyone"], ["off", "Nobody"]],
  conversationFollow: [["auto", "Automatically"], ["ask", "When they press the follow key"]],
  death: [["revive", "Down, wait for a revive"], ["respawn", "Respawn next to the party"], ["off", "Game default"]],
  scaling: [["default", "Server default (halfway)"], ["lowest", "Lowest player level"], ["mid", "Halfway"], ["highest", "Highest player level"]],
  commandAccess: [["admins", "Admins only"], ["everyone", "Everyone"]],
  difficultyDealt: ["Unset", "Novice", "Apprentice", "Adept", "Journeyman", "Expert", "Master"].map(t => [t, t === "Unset" ? "Game default" : t]),
};
choices.difficultyTaken = choices.difficultyDealt;

function sel(key, opts, value) {
  return `<select data-set="${key}">${opts.map(([v, t]) => `<option value="${esc(v)}"${v === value ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
}
function chk(key, value) { return `<input type="checkbox" data-set="${key}"${value ? " checked" : ""}>`; }
function txt(key, value) { return `<input type="text" class="key" maxlength="12" data-set="${key}" value="${esc(value)}">`; }
function num(key, value) { return `<input type="number" data-set="${key}" value="${value}">`; }
function srow(label, hint, control) { return `<div class="srow"><span>${esc(label)}${hint ? `<small>${esc(hint)}</small>` : ""}</span>${control}</div>`; }

function renderSettings() {
  const box = $("settings");
  if (box.contains(document.activeElement)) return;   // don't redraw under the cursor
  const st = state.settings;
  const acc = state.access;
  const leaders = [["", "Nobody"], ...state.players.map(p => [p.name, p.name])];
  if (st.leader && !leaders.some(([v]) => v === st.leader)) leaders.push([st.leader, st.leader + " (offline)"]);
  const fxRows = state.categories.map(c => `<tr><td>${esc(FX[c] || c)}<br><span class="edid">${esc(FX_HINT[c] || "")}</span></td>`
    + ["live", "join", "rejoin"].map(ph => `<td>${chk(ph + "." + c, st[ph][c])}</td>`).join("") + `</tr>`).join("");
  box.innerHTML = `
  <div class="sgroup"><h3>Quest progress</h3>
    ${srow("Progress counts from", "Anyone: a stage anyone reaches advances it for all.", sel("progressFrom", choices.progressFrom, st.progressFrom))}
    ${srow("Party leader", "Used by \"leader only\" and by respawns.", sel("leader", leaders, st.leader))}
    ${srow("Wait while someone talks", "New stages reach a player once their conversation ends.", chk("holdDuringDialogue", st.holdDuringDialogue))}
    ${srow("Announce progress in chat", "\"Alice advanced The Quest\".", chk("questMessages", st.questMessages))}
  </div>
  <div class="sgroup"><h3>Effects of a stage someone else reached</h3>
    <table class="fx"><thead><tr><th>Effect</th><th title="Someone advanced the quest while you play">Live</th><th title="Stages the party did while you were away, given when you join">On join</th><th title="Your own stages, which the game forgets and the plugin sets again each time you join">On rejoin</th></tr></thead>
    <tbody>${fxRows}</tbody></table>
    <p class="hint">The player who reaches a stage always gets every effect. Live Items is the reward rule: on, everybody gets the rewards.
      On rejoin, the reward undo puts items back anyway.</p>
  </div>
  <div class="sgroup"><h3>Conversations</h3>
    ${srow("Show others' conversations to", "An overlay like the dialogue screen; watchers can't pick topics.", sel("conversationOverlay", choices.conversationOverlay, st.conversationOverlay))}
    ${srow("Watchers follow a conversation", "Either way, the follow key while watching leaves it.", sel("conversationFollow", choices.conversationFollow, st.conversationFollow))}
    ${srow("Travel to a conversation", "The join key takes a player to whoever is talking, listening in or not: into their building or city too (needs the add-on).", chk("conversationTeleport", st.conversationTeleport))}
    ${srow("Watchers hear the voices", "The NPC's voice with each line, from nowhere, while listening in. Needs the CoopQuestSyncUI add-on.", chk("witnessVoices", st.witnessVoices))}
    ${srow("Freeze watchers", "Players in combat are never frozen.", sel("conversationFreeze", choices.conversationFreeze, st.conversationFreeze))}
    ${srow("Share rewards handed out in conversation", "Not trades (lines that also take something).", chk("shareDialogueRewards", st.shareDialogueRewards))}
    ${srow("Share quest items", "Keys, letters... picked up by one player go to everyone.", chk("shareQuestItems", st.shareQuestItems))}
  </div>
  <div class="sgroup"><h3>Party</h3>
    ${srow("When a player dies", "The revive key brings back a downed teammate next to you; the respawn key respawns.", sel("death", choices.death, st.death))}
    ${srow("Seconds before respawning", "", num("reviveSeconds", st.reviveSeconds))}
    ${srow("Put players back where they left", "When they join. Outdoors: the same spot. Inside a building: back inside (needs the add-on).", chk("returnOnJoin", st.returnOnJoin))}
    ${srow("Black screen while travelling", "Hides the jumps while a player is put back where they left, or travels to a teammate.", chk("travelScreen", st.travelScreen))}
    ${srow("Keys", "Alt + a letter the game doesn't use (K is the chat). Follow: listen in or leave a conversation. Join: travel to the talker.", `Follow ${txt("keyFollow", st.keyFollow)} Join ${txt("keyJoin", st.keyJoin)} Revive ${txt("keyRevive", st.keyRevive)} Respawn ${txt("keyRespawn", st.keyRespawn)}`)}
    ${srow("Revive distance (cm)", "400 is about four metres.", num("reviveRange", st.reviveRange))}
    ${srow("Tags over heads", "Talking, bartering, picking a lock, down.", chk("statusTags", st.statusTags))}
    ${srow("Level of spawns and loot", "", sel("scaling", choices.scaling, st.scaling))}
    ${srow("Difficulty, damage dealt", "", sel("difficultyDealt", choices.difficultyDealt, st.difficultyDealt))}
    ${srow("Difficulty, damage taken", "", sel("difficultyTaken", choices.difficultyTaken, st.difficultyTaken))}
    ${srow("Friendly fire", "Always on: OblivionMP can't tell mods who hit whom.", `<span class="edid">On</span>`)}
  </div>
  <div class="sgroup"><h3>Commands</h3>
    ${srow("Who can use admin commands", "/qs push, auto, source, reset, /qsprobe and /coop test. The others (/qs status, /coop follow...) are for everyone.", sel("commandAccess", choices.commandAccess, st.commandAccess))}
    ${srow("ReadyM panel admins", "Everyone in the Admins view of the ReadyM admin panel (port 9050) is an admin here too.", `<span class="edid">${acc ? esc(acc.panelOk ? "Working" : "Not available") : ""}</span>`)}
    ${acc && !acc.panelOk ? `<p class="hint">${esc(acc.panel)}</p>` : ""}
    ${srow("Admins added here", "Use \"Make admin\" next to a player above. Stored by ReadyM account, so it works whatever their nickname.",
      st.admins.length ? st.admins.map(a => `<span class="admin">${esc(a.name || a.id)} <button class="mini" data-admin-remove="${esc(a.id)}" title="${esc(a.id)}">Remove</button></span>`).join(" ") : `<span class="edid">None</span>`)}
  </div>`;
}

$("settings").addEventListener("click", e => {
  const b = e.target.closest("[data-admin-remove]");
  if (!b) return;
  if (confirm("Remove this admin?")) act({ action: "admin-remove", id: b.dataset.adminRemove });
  b.blur();
});
$("settings").addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if (!el) return;
  const value = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value;
  act({ action: "set", key: el.dataset.set, value });
  el.blur();
});
$("q").addEventListener("input", () => state && render());
$("filter").addEventListener("change", () => state && render());

refresh();
setInterval(refresh, 2000);
</script>
